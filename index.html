<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday QR Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 90%;
        }
        .qr-code {
            width: 250px;
            height: 250px;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            background-color: #c0392b;
        }
        .movie-list {
            display: none;
            margin-top: 10px;
        }
        .movie-option {
            display: flex;
            align-items: center;
            margin: 5px 0;
            cursor: pointer;
        }
        .movie-option input {
            display: none;
        }
        .movie-option label {
            padding: 10px;
            font-size: 16px;
            border: 2px solid transparent;
            border-radius: 5px;
            background-color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .movie-option input:checked + label {
            border-color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p>Please show this QR code to staff to redeem your gift.</p>
        <img src="qrbday_qr.png" alt="QR Code" class="qr-code">
        <button class="btn" onclick="showMovies()">Choose Your Movie</button>
        <div class="movie-list" id="movieList">
            <p>Select a movie:</p>
            <form id="movieForm">
                <div class="movie-option">
                    <input type="radio" id="movie1" name="movie" value="Bob Marley One Love">
                    <label for="movie1">Bob Marley One Love</label>
                </div>
                <div class="movie-option">
                    <input type="radio" id="movie2" name="movie" value="Gone Girl">
                    <label for="movie2">Gone Girl</label>
                </div>
                <div class="movie-option">
                    <input type="radio" id="movie3" name="movie" value="The Broken Hearts Gallery">
                    <label for="movie3">The Broken Hearts Gallery</label>
                </div>
                <div class="movie-option">
                    <input type="radio" id="movie4" name="movie" value="Lord of the Rings">
                    <label for="movie4">Lord of the Rings</label>
                </div>
                <div class="movie-option">
                    <input type="radio" id="movie5" name="movie" value="The Hobbit">
                    <label for="movie5">The Hobbit</label>
                </div>
                <div class="movie-option">
                    <input type="radio" id="movie6" name="movie" value="Harry Potter and the Prisoner of Azkaban">
                    <label for="movie6">Harry Potter and the Prisoner of Azkaban</label>
                </div>
                <div class="movie-option">
                    <input type="radio" id="movie7" name="movie" value="Madea's Witness Protection">
                    <label for="movie7">Madea's Witness Protection</label>
                </div>
                <div class="movie-option">
                    <input type="radio" id="movie8" name="movie" value="Home">
                    <label for="movie8">Home</label>
                </div>
                <div class="movie-option">
                    <input type="radio" id="movie9" name="movie" value="Request a Movie">
                    <label for="movie9">Request a Movie</label>
                </div>
            </form>
        </div>
    </div>
    <script>
        function showMovies() {
            document.getElementById('movieList').style.display = 'block';
        }
    </script>
</body>
</html>
